task:
  name: Onyx Kernel Build
  timeout_in: 120m

  container:
    image: ubuntu:22.04
    cpu: 8
    memory: 16G

  setup_script:
    - apt update
    - DEBIAN_FRONTEND=noninteractive apt install -y bc bison build-essential curl flex g++-multilib gcc-multilib git libelf-dev libssl-dev lzop rsync zip python3 clang lld llvm

  clone_script:
    - git clone https://github.com/71chjzkc/onyx_clo -b 6.6.77-capybara-clo-2.4 kernel
    - git clone https://github.com/llvm/llvm-project clang

  build_script:
    - |
      export ARCH=arm64
      export SUBARCH=arm64
      export LLVM=1
      export LLVM_IAS=1
      export PATH=$PWD/clang/bin:$PATH

      cd kernel

      # ResuKiSU
      git clone https://github.com/rsuntk/ResuKiSU KernelSU
      cp -r KernelSU drivers/
      echo 'source "drivers/KernelSU/Kconfig"' >> drivers/Kconfig
      echo 'obj-$(CONFIG_KSU) += KernelSU/' >> drivers/Makefile

      make onyx_defconfig

      scripts/config --enable KSU
      scripts/config --enable KSU_MANUAL_HOOK
      scripts/config --enable KSU_SUSFS
      scripts/config --enable KPM
      scripts/config --enable KPROBES
      scripts/config --enable KALLSYMS
      scripts/config --enable KALLSYMS_ALL

      scripts/config --disable LTO_CLANG
      scripts/config --disable LTO_CLANG_THIN
      scripts/config --disable LTO_CLANG_FULL
      scripts/config --enable LTO_NONE

      make olddefconfig
      make -j8

  artifacts:
    path: kernel/arch/arm64/boot/Image
