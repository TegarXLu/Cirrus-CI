env:
    CIRRUS_CLONE_DEPTH: 1
    BUILD_HOSTNAME: "CirrusCI"
    DEBIAN_FRONTEND: "noninteractive"
    CHERISH_WORKING_DIR: "/home/kernelpanix/DerpFest"
    CIRRUS_OUT_DIR: "/home/kernelpanix/out/Rodin"
    PD_API_KEY: ENCRYPTED[34bc583e19c47c56dc0c1f9950553e9d9c8ec6dcee3c46ed85b83d089ae3e7546324f893ff919531195207645caf9333]
    SF_PASSWORD: ENCRYPTED[134c9f2823c604c8aae1c1f5ec7b34d7773665677a0d36c41883026c6b703f5362b2d92eebeb550c9a2707fbe337d721]

task:
  name: Environment Setup
  skip: $CIRRUS_BRANCH != 'DerpFest-A16'
  alias: Enviroment
  persistent_worker:
  timeout_in: 24h

  script:
    - echo "Starting setup environment..."
    - echo $(pwd)

  check_script:
    - echo $(nproc --all)
    - echo $(free -mh)
    - echo $(df -h)

  enviroment_script:
    - rm -rf $CIRRUS_OUT_DIR
    - mkdir -p $CIRRUS_OUT_DIR
    - rm -rf $CIRRUS_WORKING_DIR/out/.lock
    - cd $CIRRUS_OUT_DIR
    - wget https://github.com/ling-zhou/rust-sshpass/releases/download/1.1.5/sshpass-1.1.5-x86_64-linux.tar.xz
    - tar -xvf sshpass-1.1.5-x86_64-linux.tar.xz
    - wget https://github.com/ManuelReschke/go-pd/releases/download/v1.5.0/go-pd_1.5.0_linux_amd64.tar.gz
    - tar -xvf go-pd_1.5.0_linux_amd64.tar.gz

task:
  name: Poco X7 Pro (Rodin) Build
  skip: $CIRRUS_BRANCH != 'DerpFest-A16'
  alias: RodinBuild
  depends_on: Enviroment
  persistent_worker:
  timeout_in: 24h
  rodin_script:
    - cd $CHERISH_WORKING_DIR
    - DEVICE="rodin"
    - echo "Setting up device tree for Poco X7 Pro (Rodin)..."
    - git remote add rodin https://github.com/mt6899-rodin/android_device_xiaomi_rodin.git
    - git fetch rodin
    - git checkout lineage-23.1
    - echo "Setting up kernel for Rodin..."
    - git clone https://github.com/mt6899-rodin/android_kernel_xiaomi_rodin.git kernel/xiaomi/rodin -b lineage-23.1
    - echo "Setting up vendor for Rodin..."
    - git clone https://github.com/mt6899-rodin/android_vendor_xiaomi_rodin.git vendor/xiaomi/rodin
    - . build/envsetup.sh > /dev/null 2>&1 || true
    - lunch lineage_rodin-user && mka derp -j$(nproc --all) | tee log.txt
    - mv out/target/product/rodin/DerpFest-*-$DEVICE-*.zip $CIRRUS_OUT_DIR/

task:
  name: Upload Build Artifacts
  skip: $CIRRUS_BRANCH != 'DerpFest-A16'
  persistent_worker:
  timeout_in: 24h
  depends_on:
    - RodinBuild

  pixeldrain_script:
    - cd $CIRRUS_OUT_DIR/
    - ./go-pd upload -k $PD_API_KEY *.zip -v

  sourceforge_script:
    - cd $CIRRUS_OUT_DIR/
    - ./sshpass -p $SF_PASSWORD rsync -avP ./*.zip dopaemon@frs.sourceforge.net:/home/frs/project/android-unofficial/Android-16/DerpFest
