container:
  image: ubuntu:22.04 # Menggunakan Ubuntu LTS sebagai basis

task:
  name: Build Kernel Onyx CLO
  timeout_in: 120m
  
  # Resource Request (Opsional, sesuaikan dengan kuota Cirrus CI Anda)
  cpu: 8
  memory: 16G

  env:
    # URL Source & Branch
    REPO_URL: "https://github.com/71chjzkc/onyx_clo"
    REPO_BRANCH: "susfs-6.6.56-capybara-clo-2.4"
    # URL Clang
    CLANG_URL: "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-Linux-X64.tar.xz"
    # Build Variables
    ARCH: arm64
    SUBARCH: arm64
    CC: clang
    NM: llvm-nm
    OBJCOPY: llvm-objcopy
    OBJDUMP: llvm-objdump
    STRIP: llvm-strip

  install_dependencies_script:
    - apt-get update && apt-get install -y wget curl git make bc bison flex libssl-dev libelf-dev xz-utils libncurses-dev python3 python-is-python3

  setup_toolchain_script:
    - mkdir -p clang
    - wget -qO- $CLANG_URL | tar -xJ --strip-components=1 -C clang
    - echo "PATH=$PWD/clang/bin:$PATH" >> $CIRRUS_ENV

  clone_source_script:
    - git clone --depth 1 --branch $REPO_BRANCH $REPO_URL source
  
  build_script:
    - cd source
    - export PATH=$PWD/../clang/bin:$PATH
    - make O=out ARCH=$ARCH vendor/capybara_defconfig # Sesuaikan defconfig jika namanya berbeda
    - make -j$(nproc --all) O=out \
        ARCH=$ARCH \
        CC=clang \
        CROSS_COMPILE=aarch64-linux-gnu- \
        CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
        LLVM=1 \
        LLVM_IAS=1

  # Mengambil hasil build (Image.gz atau dtbo)
  artifacts:
    path: "source/out/arch/arm64/boot/Image*"
